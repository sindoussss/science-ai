[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-ai"
version = "0.1.0"
description = "Local multi-agent research system: deterministic tools compute, a controller decides, a graph records."
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy==1.17.1",  # pinned: phys.constant records the CODATA release this version ships
    "mpmath>=1.3",
    "pint==0.25.3",   # pinned: the independent check for phys.constant
    "networkx>=3.2",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "PyQt6>=6.6",
    "pandas>=2.1",
    "openpyxl>=3.1",   # Excel import, and the independent re-read of .xlsx files
    "statsmodels==0.15.0",  # pinned: the independent checker for regression, ANOVA and t-tests
    # Pinned: descriptor values and fingerprint bits must not shift between releases, or a
    # fingerprint stops matching its stored node and a check starts disagreeing with itself.
    # Wheels cover CPython 3.10-3.14 on Windows, macOS and Linux, so no compiler is needed.
    "rdkit==2026.3.6",
    "pypdf>=6.1",      # local text extraction for the literature corpus; pure Python
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
sciai = "sciai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sciai.store" = ["schema.sql"]
"sciai.llm" = ["prompts/*.md"]
"sciai.ui.theme" = ["*.json", "fonts/*"]
"sciai" = ["../../config/default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Ollama server (deselected by default)"]
addopts = "-m 'not live'"
