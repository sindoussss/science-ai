# Science AI defaults. Copy to ~/.sciai/config.toml to override any key.

[model]
name = "qwen2.5:7b-instruct-q4_K_M"   # any 7-12B 4-bit model served by Ollama
ollama_url = "http://127.0.0.1:11434" # must be localhost: no outside network at runtime
# Context window, set explicitly (Ollama's default is smaller and silently truncates).
# 8GB VRAM budget, roughly: 7-8B Q4 weights ~4.5-5GB + KV cache. With GQA models
# (Qwen2.5, Llama 3.x) 8192 tokens of KV cache is ~0.5-1GB, which fits; 12B models
# should drop to 4096. The graph digest is sized to whatever num_ctx says.
num_ctx = 8192
num_predict = 384          # max tokens per reply; actions are short JSON
temperature = 0.0
keep_alive = "30m"
request_timeout = 240
# Reasoning mode for models that have one (qwen3, deepseek-r1, ...). Off: actions are short JSON and
# thinking tokens count against num_predict. If you turn it on, raise num_predict (e.g. 2048).
# Any <think>...</think> text a model still writes into its reply is removed before parsing.
think = false

[controller]
max_steps = 14
max_invalid_streak = 2     # consecutive invalid outputs (after their retry) before stopping
auto_confirm_root = false  # the UI asks the user to confirm the formalized problem

[risk]
stakes_threshold = 2       # unverified node with this many transitive dependents gets checked
min_confidence = 0.9
structural_int_max = 10    # small integers (orders, exponents) allowed in tool args without a source

[tools]
timeout = 20

[physics]
# Range rules keyed on a quantity's kind: an absolute temperature below 0 K, an efficiency
# outside [0, 1] or a speed above c fails its node. Off: only dimensional checks run.
plausibility = true

[data]
alpha = 0.05               # significance level when the question gives none
max_rows = 5000000         # larger files are refused at import (the tool sandbox has 3 GB)
max_file_mb = 400          # so are files above this size: pandas needs several times the file in memory
data_dir = "~/.sciai/datasets"  # imported files are copied here, named by their SHA-256

[chem]
# Chemistry is computational screening only. Every chem node is a hypothesis, whatever its
# checks say, and no tool here plans a reaction, writes a procedure or gives a dose.
# Tanimoto at or above this (Morgan radius 2, 2048 bits) counts a structure as a close analog
# of a restricted one and refuses it. Measured: one substituent changed sits near 0.77, two
# unrelated working drugs that share a scaffold near 0.54. Lowering it refuses more.
analog_tanimoto = 0.70
# A literature passage is cut to this many characters before it is shown or stored, so an
# imported document cannot push a wall of text through the answer.
max_passage_chars = 1200
# Imported documents and the search index built from them. Methods and procedure
# sections are dropped before the index is written, so they cannot be searched.
corpus_dir = "~/.sciai/corpus"

[store]
db_path = "~/.sciai/knowledge.db"
